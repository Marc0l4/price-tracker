name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: price_tracker_test
          POSTGRES_USER: price_tracker_test
          POSTGRES_PASSWORD: price_tracker_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_tracker_test -d price_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://price_tracker_test:price_tracker_test_password@localhost:5432/price_tracker_test?schema=public
      TEST_DATABASE_URL: postgresql://price_tracker_test:price_tracker_test_password@localhost:5432/price_tracker_test?schema=public
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      COLLECTION_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      # Os testes PostgreSQL reutilizam o mesmo banco temporário do service container.
      - run: npm --workspace=@price-tracker/api run test -- --no-file-parallelism
      - run: npm run test:web
      - run: npm run build:api
      - run: npm run build:web
